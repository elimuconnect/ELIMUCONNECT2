
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School Bus Tracker</title>

  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      color: white;
      background: #123b70;
    }

    header h1 { margin: 0 0 8px; }
    header p { margin: 0; }

    main {
      max-width: 950px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      box-shadow: 0 5px 18px #0000000d;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
      background: #123b70;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #map {
      height: 430px;
      border-radius: 12px;
      z-index: 1;
    }

    #status {
      background: #eff6ff;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #busList {
      display: grid;
      gap: 12px;
    }

    .bus {
      padding: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .bus h3 { margin: 0 0 8px; }

    .active {
      color: #15803d;
      font-weight: bold;
    }

    .muted {
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      #map { height: 350px; }
      .card { padding: 14px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>School Bus Tracker</h1>
    <p>Find your school bus in real time</p>
  </header>

  <main>
    <section class="card">
      <h2>Find Your Bus</h2>

      <label for="parentPhone">Your phone number (optional)</label>
      <input id="parentPhone" type="tel"
        placeholder="Enter your phone number"
        autocomplete="tel">

      <button id="savePhone">Save Phone Number</button>

      <label for="schoolFilter">Select school</label>
      <select id="schoolFilter">
        <option value="">All schools</option>
      </select>

      <button id="enableAlerts">Enable Distance Alerts</button>

      <p class="muted">
        Allow location access to calculate the distance between you and
        an active bus. Keep this page open for alerts.
      </p>

      <div id="status" role="status" aria-live="polite">
        Loading active buses...
      </div>
    </section>

    <section class="card">
      <h2>Live Bus Map</h2>
      <div id="map"></div>
    </section>

    <section class="card">
      <h2>Active Buses</h2>
      <div id="busList">Loading buses...</div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://hhtplinfcdwgahlhurhx.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_cOXipkG4wSKIkIHwkP04JA_KunvG7T5";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = id => document.getElementById(id);

    const map = L.map("map").setView([-3.969988, 39.735031], 12);

    L.tileLayer(
      "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
      { attribution: "&copy; OpenStreetMap contributors" }
    ).addTo(map);

    const busMarkers = new Map();

    let buses = [];
    let parentPosition = null;
    let locationWatchId = null;
    let audioContext = null;
    let alertsEnabled = false;
    let loading = false;
    let lastLoadSucceeded = false;

    const alertedBuses = new Set();
    const ALERT_DISTANCE_METRES = 200;
    const STALE_AFTER_MS = 2 * 60 * 1000;

    // Parent phone number is stored only on this device.
    $("parentPhone").value =
      localStorage.getItem("school_bus_parent_phone") || "";

    $("savePhone").addEventListener("click", () => {
      const phone = $("parentPhone").value.trim();

      if (phone) {
        localStorage.setItem("school_bus_parent_phone", phone);
        $("status").textContent = "Phone number saved on this device.";
      } else {
        localStorage.removeItem("school_bus_parent_phone");
        $("status").textContent = "Saved phone number cleared.";
      }
    });

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function validCoordinates(bus) {
      const lat = Number(bus.lat);
      const lng = Number(bus.lng);

      return Number.isFinite(lat) &&
        Number.isFinite(lng) &&
        lat >= -90 && lat <= 90 &&
        lng >= -180 && lng <= 180;
    }

    function distanceMetres(a, b) {
      const rad = degrees => degrees * Math.PI / 180;
      const earthRadius = 6371000;

      const dLat = rad(b.lat - a.lat);
      const dLng = rad(b.lng - a.lng);
      const lat1 = rad(a.lat);
      const lat2 = rad(b.lat);

      const x =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) * Math.cos(lat2) *
        Math.sin(dLng / 2) ** 2;

      return 2 * earthRadius *
        Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function distanceText(bus) {
      if (!parentPosition) {
        return "Enable location to see distance.";
      }

      if (!validCoordinates(bus)) {
        return "Location unavailable.";
      }

      const distance = distanceMetres(parentPosition, {
        lat: Number(bus.lat),
        lng: Number(bus.lng)
      });

      if (distance < 1000) {
        return Math.round(distance) + " metres away";
      }

      return (distance / 1000).toFixed(2) + " km away";
    }

    function playBell() {
      if (!audioContext || !alertsEnabled) return;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = 880;
      gain.gain.value = 0.18;

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.7
      );

      oscillator.stop(audioContext.currentTime + 0.7);
    }

    $("enableAlerts").addEventListener("click", async () => {
      if (!navigator.geolocation) {
        $("status").textContent =
          "This browser does not support location services.";
        return;
      }

      try {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
          if (!audioContext) {
            audioContext = new AudioContextClass();
          }

          await audioContext.resume();
        }

        if (locationWatchId === null) {
          locationWatchId = navigator.geolocation.watchPosition(
            position => {
              parentPosition = {
                lat: position.coords.latitude,
                lng: position.coords.longitude
              };

              updateBusList();
              updateMarkers();
              checkDistances();
            },
            error => {
              console.error("Parent location error:", error);

              $("status").textContent =
                "Could not get your location. Allow location permission " +
                "and open this page using HTTPS.";
            },
            {
              enableHighAccuracy: true,
              maximumAge: 5000,
              timeout: 20000
            }
          );
        }

        alertsEnabled = true;

        $("enableAlerts").textContent = "Distance Alerts Enabled";

        $("status").textContent =
          "Distance alerts enabled. An alert will sound when a bus " +
          "comes within 200 metres.";

        checkDistances();
      } catch (error) {
        console.error("Could not enable alerts:", error);

        $("status").textContent =
          "Could not enable sound alerts. Please try again.";
      }
    });

    function getSchoolName(bus) {
      return bus.school_name || "School unavailable";
    }

    function renderSchoolOptions() {
      const select = $("schoolFilter");
      const previous = select.value;

      const schoolMap = new Map();

      buses.forEach(bus => {
        if (bus.school_id && bus.school_name) {
          schoolMap.set(bus.school_id, bus.school_name);
        }
      });

      select.replaceChildren();

      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = "All schools";
      select.appendChild(allOption);

      [...schoolMap.entries()]
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([schoolId, schoolName]) => {
          const option = document.createElement("option");
          option.value = schoolId;
          option.textContent = schoolName;
          select.appendChild(option);
        });

      if ([...select.options].some(option => option.value === previous)) {
        select.value = previous;
      }
    }

    function getVisibleBuses() {
      const selectedSchool = $("schoolFilter").value;

      return buses.filter(bus =>
        !selectedSchool || bus.school_id === selectedSchool
      );
    }

    function updateMarkers() {
      const visible = getVisibleBuses();
      const visibleIds = new Set(
        visible.map(bus => bus.driver_id)
      );

      for (const [driverId, marker] of busMarkers.entries()) {
        if (!visibleIds.has(driverId)) {
          map.removeLayer(marker);
          busMarkers.delete(driverId);
        }
      }

      visible.forEach(bus => {
        if (!validCoordinates(bus)) return;

        const lat = Number(bus.lat);
        const lng = Number(bus.lng);

        const popup = `
          <strong>${escapeHtml(bus.driver_name || "School Bus")}</strong><br>
          School: ${escapeHtml(getSchoolName(bus))}<br>
          Status: Active<br>
          Distance: ${escapeHtml(distanceText(bus))}<br>
          Last update: ${escapeHtml(
            new Date(bus.updated_at).toLocaleString()
          )}
        `;

        let marker = busMarkers.get(bus.driver_id);

        if (!marker) {
          marker = L.marker([lat, lng]).addTo(map);
          busMarkers.set(bus.driver_id, marker);
        } else {
          marker.setLatLng([lat, lng]);
        }

        marker.bindPopup(popup);
      });
    }

    function updateBusList() {
      const visible = getVisibleBuses();
      const list = $("busList");

      list.replaceChildren();

      if (!visible.length) {
        list.textContent =
          "No active buses found for this school right now.";
        return;
      }

      visible.forEach(bus => {
        const card = document.createElement("div");
        card.className = "bus";

        const heading = document.createElement("h3");
        heading.textContent = bus.driver_name || "School Bus";

        const status = document.createElement("p");
        status.className = "active";
        status.textContent = "Journey active";

        const school = document.createElement("p");
        school.textContent = "School: " + getSchoolName(bus);

        const distance = document.createElement("p");
        distance.textContent = "Distance: " + distanceText(bus);

        const updated = document.createElement("p");
        updated.className = "muted";
        updated.textContent =
          "Last GPS update: " +
          new Date(bus.updated_at).toLocaleString();

        card.append(heading, status, school, distance, updated);
        list.appendChild(card);
      });
    }

    function checkDistances() {
      if (!parentPosition || !alertsEnabled) return;

      getVisibleBuses().forEach(bus => {
        if (!validCoordinates(bus)) return;

        const distance = distanceMetres(parentPosition, {
          lat: Number(bus.lat),
          lng: Number(bus.lng)
        });

        if (distance <= ALERT_DISTANCE_METRES) {
          if (!alertedBuses.has(bus.driver_id)) {
            alertedBuses.add(bus.driver_id);
            playBell();

            $("status").textContent =
              "Alert: " + (bus.driver_name || "A school bus") +
              " is within 200 metres.";
          }
        } else {
          alertedBuses.delete(bus.driver_id);
        }
      });
    }

    async function loadBuses() {
      if (loading) return;
      loading = true;

      try {
        // Fetch active bus GPS positions.
        const { data: locations, error } = await db
          .from("school_bus_locations")
          .select("driver_id,school_id,lat,lng,is_active,updated_at")
          .eq("is_active", true);

        if (error) throw error;

        const freshLocations = (locations || []).filter(location => {
          const updated = new Date(location.updated_at).getTime();

          return Number.isFinite(updated) &&
            Date.now() - updated >= 0 &&
            Date.now() - updated <= STALE_AFTER_MS;
        });

        // Only fetch display names for drivers currently on the map.
        const driverIds = [
          ...new Set(freshLocations.map(location => location.driver_id))
        ];

        let drivers = [];

        if (driverIds.length) {
          const { data, error: driverError } = await db
            .from("drivers")
            .select("id,name,school_id")
            .in("id", driverIds);

          if (driverError) throw driverError;
          drivers = data || [];
        }

        // Use the existing school-list RPC from the driver page.
        const { data: schoolData, error: schoolError } =
          await db.rpc("get_bus_schools");

        if (schoolError) throw schoolError;

        const driverMap = new Map(
          drivers.map(driver => [driver.id, driver])
        );

        const schoolMap = new Map(
          (schoolData || []).map(school => [
            school.id,
            school.school_name || school.name || "School"
          ])
        );

        buses = freshLocations.map(location => {
          const driver = driverMap.get(location.driver_id) || {};

          return {
            ...location,
            driver_name: driver.name || "School Bus",
            school_name: schoolMap.get(location.school_id) ||
              "School unavailable"
          };
        });

        renderSchoolOptions();
        updateMarkers();
        updateBusList();
        checkDistances();

        lastLoadSucceeded = true;

        if (!alertsEnabled || !parentPosition) {
          $("status").textContent = buses.length
            ? buses.length + " active bus(es) found."
            : "No active buses found right now.";
        }
      } catch (error) {
        console.error("Failed to load buses:", error);

        if (!lastLoadSucceeded) {
          $("status").textContent =
            "Could not load buses. Check the Supabase connection, " +
            "school-list RPC, and table permissions.";
          $("busList").textContent = "Unable to load buses.";
        } else {
          $("status").textContent =
            "Could not refresh bus locations. Retrying shortly.";
        }
      } finally {
        loading = false;
      }
    }

    $("schoolFilter").addEventListener("change", () => {
      updateMarkers();
      updateBusList();
      checkDistances();
    });

    loadBuses();

    // Refresh GPS positions every 10 seconds.
    setInterval(loadBuses, 10000);
  </script>
</body>
</html>
